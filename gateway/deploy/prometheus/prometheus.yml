# TsukiyoHub —— Prometheus 采集 + 规则配置
#
# 采集两个服务：
#   * tsukiyo-gateway（Go，LLM 路由网关）：/metrics 在管理端口（默认 :8082），也可用 :8081
#   * tsukiyohub（Python，聊天 / 技能 / RAG 内核）：/metrics 在 :8080
#
# 与「网关内置告警引擎」的关系：
#   * 内置引擎是「网关自己就会告警」，零依赖、开箱即用（规则在 gateway/config.json 的 alerts.rules）；
#   * 本文件是外部 Prometheus + Alertmanager 链路：负责长期留存、跨服务聚合、团队既有值班/抑制/静默。
#   两条链路可以同时开，规则各自独立。
#
# 启动：
#   docker compose --profile monitor up -d          # prometheus + alertmanager（+ grafana）
# 本机直跑：
#   prometheus --config.file=gateway/deploy/prometheus/prometheus.yml
#   容器里访问宿主机服务时把 targets 换成 host.docker.internal:8081 / :8080
#
# 指标语义见 docs/observability.md。

global:
  scrape_interval: 15s      # 与网关内置 15s 评估间隔对齐；高基数场景可调到 30s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: local
    env: local

rule_files:
  - recording_rules.yml
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]   # 本机跑改成 127.0.0.1:9093
      timeout: 10s

scrape_configs:
  # ---------------------------------------------------------------- 网关
  # /metrics 由网关手写 exposition（零第三方依赖）；管理端口默认 :8082
  - job_name: tsukiyo-gateway
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["gateway:8082"]
        labels:
          service: tsukiyo-gateway
          component: gateway
          env: local

  # ------------------------------------------------------------ 聊天内核
  # FastAPI /metrics：HTTP、问答、检索、技能、SSE 首字、知识库规模
  - job_name: tsukiyohub-core
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["app:8080"]
        labels:
          service: tsukiyohub
          component: core
          env: local

  # 可选：Prometheus 自己，便于排查「抓不到目标」是网络还是服务问题
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]