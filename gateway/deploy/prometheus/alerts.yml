# TsukiyoHub 网关 —— Prometheus 告警规则
#
# 指标全部来自网关 /metrics（internal/metrics 手写 exposition），名字见
# docs/design/gateway-contract.md「网关必须暴露的 Prometheus 指标名」：
#
#   tsukiyo_gateway_requests_total{route,model,provider,status}
#   tsukiyo_gateway_request_duration_seconds_bucket{route,model,provider,le}
#   tsukiyo_gateway_ttft_seconds_bucket{route,model,provider}
#   tsukiyo_gateway_tokens_total{model,direction}
#   tsukiyo_gateway_cost_usd_total{model}
#   tsukiyo_gateway_inflight
#   tsukiyo_gateway_breaker_state{model}      # 0=closed 1=half_open 2=open
#   tsukiyo_gateway_provider_up{provider}     # 1/0
#   tsukiyo_gateway_ratelimit_rejected_total{client}
#   tsukiyo_gateway_budget_rejected_total{client}
#   tsukiyo_gateway_alerts_firing
#
# 改阈值的原则：先按「业务可接受」定 SLO，再看最近一周的实际分布；
# 不要照抄这里的数字（示例值假设的是单机、低流量部署）。
#
# 校验语法（容器里自带 promtool）：
#   docker run --rm -v ${PWD}:/cfg --entrypoint promtool prom/prometheus:latest \
#     check rules /cfg/alerts.yml

groups:
  # 面向「用户已经受影响」的问题：错误率、延迟、熔断、上游不可用
  - name: tsukiyo-gateway-availability
    interval: 30s
    rules:
      - alert: TsukiyoGatewayErrorRateHigh
        # 最近 5 分钟 5xx 占比 > 10%。clamp_min 防止 0 请求时除零得到 NaN。
        expr: |
          (
            sum(rate(tsukiyo_gateway_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(tsukiyo_gateway_requests_total[5m])), 1e-9)
          ) > 0.1
        for: 2m
        labels:
          severity: critical
          component: gateway
          runbook: docs/alerts.md
        annotations:
          summary: "网关错误率超过 10%（当前 {{ $value | humanizePercentage }}）"
          description: >-
            最近 5 分钟上游 5xx 占比过高。先用 /admin/api/overview 看是哪个 provider 在报错，
            再检查该供应商的 key/余额/网络；如果只是单模型问题，确认 fallback 是否生效。

      - alert: TsukiyoGatewayP95LatencyHigh
        # 直方图分位数：只按 le 聚合，避免 route/model 维度把桶拆散
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(tsukiyo_gateway_request_duration_seconds_bucket[5m]))
          ) > 5
        for: 5m
        labels:
          severity: warning
          component: gateway
          runbook: docs/alerts.md
        annotations:
          summary: "网关 P95 延迟超过 5s（当前 {{ $value | humanizeDuration }}）"
          description: >-
            整体延迟偏高。区分「上游慢」和「网关慢」：看 tsukiyo_gateway_ttft_seconds 是否同步变差；
            SSE 长连接会天然拉高 P95，流式占比高时可适当放宽阈值。

      - alert: TsukiyoGatewayBreakerOpen
        # breaker_state=2 表示 open；统计处于熔断的模型个数
        expr: count(tsukiyo_gateway_breaker_state == 2) > 0
        for: 1m
        labels:
          severity: critical
          component: gateway
          runbook: docs/alerts.md
        annotations:
          summary: "有 {{ $value }} 个模型处于熔断状态"
          description: >-
            连续失败触发了熔断（breaker.failure_threshold），这些模型暂时不会被选中。
            检查对应模型的上游可用性与错误类型；恢复需要等 open_seconds 到期。

      - alert: TsukiyoGatewayProviderDown
        # 逐 series 告警，$labels.provider 直接指出是谁挂了
        expr: tsukiyo_gateway_provider_up == 0
        for: 1m
        labels:
          severity: critical
          component: provider
          runbook: docs/alerts.md
        annotations:
          summary: "供应商 {{ $labels.provider }} 探活失败"
          description: >-
            provider_up=0 表示最近一次探活（GET base_url + health_path）没返回 200。
            检查 base_url、API Key、容器网络；此时请求会走其它候选或 fallback。

      - alert: TsukiyoGatewayTargetDown
        # 网关进程挂了 / 端口或 metrics_path 变了：up 是 Prometheus 自带的抓取结果
        expr: up{job="tsukiyo-gateway"} == 0
        for: 1m
        labels:
          severity: critical
          component: gateway
          runbook: docs/alerts.md
        annotations:
          summary: "Prometheus 抓不到网关指标（up=0）"
          description: >-
            先确认网关进程是否活着（curl /healthz），再看 /metrics 端口与 prometheus.yml 的 targets 是否一致。

  # 面向「成本 / 配额」的问题：限流、预算、费用异常增长
  - name: tsukiyo-gateway-cost
    interval: 60s
    rules:
      - alert: TsukiyoGatewayRateLimitedSpike
        # 限流拒绝量：5 分钟内超过 20 次（≈4 次/分钟）
        expr: sum(increase(tsukiyo_gateway_ratelimit_rejected_total[5m])) > 20
        for: 5m
        labels:
          severity: warning
          component: gateway
          runbook: docs/alerts.md
        annotations:
          summary: "5 分钟内限流拒绝约 {{ $value | humanize }} 次"
          description: >-
            客户端 RPM/TPM 打满。确认是真实流量增长（该扩容/调 quota）还是单个 client 失控（该限死）。

      - alert: TsukiyoGatewayBudgetRejected
        # 任何一笔被预算拒绝的请求都值得看一眼（402）
        expr: sum(increase(tsukiyo_gateway_budget_rejected_total[10m])) > 0
        for: 5m
        labels:
          severity: critical
          component: gateway
          runbook: docs/alerts.md
        annotations:
          summary: "有请求因预算被拒（HTTP 402）"
          description: >-
            客户端的 monthly_usd 用完了。要么调预算，要么通知调用方；先从
            /admin/api/overview 的 metrics.cost_usd 确认消费节奏。

      - alert: TsukiyoGatewayCostSpike
        # 费用突增：最近 15 分钟花费 > 之前 3 小时「平均每 15 分钟」的 3 倍
        expr: |
          sum(increase(tsukiyo_gateway_cost_usd_total[15m]))
          >
          3 * sum(increase(tsukiyo_gateway_cost_usd_total[3h] offset 15m)) / 12
        for: 15m
        labels:
          severity: warning
          component: cost
          runbook: docs/alerts.md
        annotations:
          summary: "网关费用突增（最近 15 分钟约 ${{ $value | humanize }}，是历史均值的 3 倍以上）"
          description: >-
            费用异常：检查是否有客户端在跑大 prompt / 长输出、是否有模型价格配置写错
            （models[].input_price / output_price 是「每 1K tokens 美元」）。

  # ==========================================================================
  # 聊天 / 技能 / RAG 内核（Python 服务 :8080/metrics）
  # 指标语义见 docs/observability.md；记录规则见 recording_rules.yml
  # ==========================================================================
  - name: tsukiyohub-core-quality
    interval: 30s
    rules:
      - alert: TsukiyoCoreGroundedRatioLow
        # 「有据回答」占比过低：知识库覆盖不足 / 检索退化 / 阈值配错
        expr: |
          (
            tsukiyohub:grounded_ratio < 0.5
            and
            sum(rate(tsukiyohub_chat_requests_total[5m])) > 0.02
          )
        for: 15m
        labels:
          severity: warning
          component: core
          runbook: docs/observability.md
        annotations:
          summary: "有据回答占比仅 {{ $value | humanizePercentage }}（阈值 50%）"
          description: >-
            先看 /api/knowledge/stats 与检索调试 /api/knowledge/search：
            命中分数是否整体偏低（换 embedding 模型后阈值要重标定）、
            知识库里是否缺对应文档。再看 tsukiyohub_retrieval_hits 分布。

      - alert: TsukiyoCoreDegradedHigh
        # 降级率过高：没走大模型（无 Key / 模型全挂）或全部走原文摘录
        expr: |
          (
            tsukiyohub:degraded_ratio > 0.2
            and
            sum(rate(tsukiyohub_chat_requests_total[5m])) > 0.02
          )
        for: 10m
        labels:
          severity: critical
          component: core
          runbook: docs/observability.md
        annotations:
          summary: "回答降级率 {{ $value | humanizePercentage }}（阈值 20%）"
          description: >-
            检查 LLM_API_KEY / 网关可达性：tsukiyohub_llm_ready 是否为 1；
            若是网关问题，看 TsukiyoGateway* 系列告警与 /api/gateway/overview。

      - alert: TsukiyoCoreRetrievalSlow
        # 检索 P95 过高：向量库/embedding 接口慢，或单次召回太多
        expr: |
          tsukiyohub:retrieval_p95_ms > 1500
          and
          sum(rate(tsukiyohub_retrieval_duration_seconds_count[5m])) > 0
        for: 10m
        labels:
          severity: warning
          component: rag
          runbook: docs/rag.md
        annotations:
          summary: "检索 P95 延迟 {{ $value | humanize }}ms（阈值 1500ms）"
          description: >-
            看 embedding 接口耗时（换 provider / 加缓存 / 降 batch）、
            向量库健康（Milvus 连接超时会让请求退化）、以及 RETRIEVAL_*_K 是否调得过大。

      - alert: TsukiyoCoreSkillFailures
        # 技能失败率：agent infra 最该盯的指标之一（工具坏了，模型再强也没用）
        expr: |
          (
            tsukiyohub:skill_failure_ratio > 0.1
            and
            sum(rate(tsukiyohub_skill_calls_total[5m])) > 0.01
          )
        for: 10m
        labels:
          severity: warning
          component: agent
          runbook: docs/skills.md
        annotations:
          summary: "技能调用失败率 {{ $value | humanizePercentage }}（阈值 10%）"
          description: >-
            按 skill 标签拆开看是哪个技能：web_fetch 常见是网络/SSRF 拦截，
            knowledge_search 是检索后端，calculator 是参数格式。可调
            POST /api/skills/{name}/test 直接复现。

      - alert: TsukiyoCoreSSEFirstTokenSlow
        # 流式首字慢：用户感知最直接的延迟
        expr: |
          tsukiyohub:sse_first_token_p95_ms > 8000
          and
          sum(rate(tsukiyohub_sse_first_token_seconds_count[5m])) > 0
        for: 10m
        labels:
          severity: warning
          component: core
          runbook: docs/observability.md
        annotations:
          summary: "SSE 首字 P95 {{ $value | humanize }}ms（阈值 8s）"
          description: >-
            首字慢但总耗时正常 → 上游模型/网关排队；两者同步变慢 → 本服务或网络。
            对照 tsukiyo_gateway:ttft_p95_ms_by_route 定位。

      - alert: TsukiyoCoreChatErrorRateHigh
        # 内核 5xx：一般是数据库/模型适配器异常
        expr: |
          (
            sum(rate(tsukiyohub_http_requests_total{path=~"/api/chat.*",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(tsukiyohub_http_requests_total{path=~"/api/chat.*"}[5m])), 1e-9)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          component: core
          runbook: docs/observability.md
        annotations:
          summary: "聊天接口 5xx 比例 {{ $value | humanizePercentage }}（阈值 5%）"
          description: >-
            查看服务日志（logs/app.log）里的 trace_id；常见原因：数据库连接断开、
            模型适配器异常、知识库索引损坏（可 /api/knowledge/reindex）。

  # ==========================================================================
  # SLO：错误预算燃烧率（多窗口，Google SRE Workbook 的 14.4x / 6x 阈值）
  # 服务本身没有 SLI 白皮书时，这是最省事的「该不该叫醒人」判断。
  # 示例 SLO：网关可用性 99.5%（错误预算 0.5%）
  # ==========================================================================
  - name: tsukiyo-slo-burn-rate
    interval: 1m
    rules:
      - alert: TsukiyoGatewaySLOBurnFast
        # 1 小时窗口燃烧率 > 14.4 → 按这个速度 2 天就会烧完 30 天预算 → 立即处理
        expr: |
          (
            sum(rate(tsukiyo_gateway_requests_total{status=~"5.."}[1h]))
            /
            clamp_min(sum(rate(tsukiyo_gateway_requests_total[1h])), 1e-9)
          ) > (14.4 * 0.005)
        for: 2m
        labels:
          severity: critical
          component: slo
          slo: "gateway-availability 99.5%"
          runbook: docs/observability.md
        annotations:
          summary: "网关错误预算燃烧过快（1h 错误率 {{ $value | humanizePercentage }}）"
          description: >-
            错误预算 0.5%：1 小时错误率超过 7.2% 即视为快速燃烧。
            此时应停止发布、回滚最近变更、检查上游供应商。

      - alert: TsukiyoGatewaySLOBurnSlow
        # 6 小时窗口燃烧率 > 6 → 一周内烧完 → 当天内跟进（不叫醒）
        expr: |
          (
            sum(rate(tsukiyo_gateway_requests_total{status=~"5.."}[6h]))
            /
            clamp_min(sum(rate(tsukiyo_gateway_requests_total[6h])), 1e-9)
          ) > (6 * 0.005)
        for: 15m
        labels:
          severity: warning
          component: slo
          slo: "gateway-availability 99.5%"
          runbook: docs/observability.md
        annotations:
          summary: "网关错误预算持续消耗（6h 错误率 {{ $value | humanizePercentage }}）"
          description: >-
            6 小时错误率超过 3% 即视为慢速燃烧：记录问题、当天内定位，
            不要等到预算烧完才开始查。
