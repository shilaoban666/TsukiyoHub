# TsukiyoHub 生产部署示例：内核服务 + PostgreSQL + Milvus
#
#   Copy-Item .env.example .env      # 填 LLM_API_KEY / EMBEDDING_API_KEY
#   docker compose up -d
#   打开 http://127.0.0.1:8080/docs
#
# 只想跑演示？把 .env 里 VECTOR_BACKEND 改回 memory、DATABASE_URL 留空，
# 只起 `docker compose up -d app` 即可（SQLite 存在卷里）。

services:
  app:
    build: .
    container_name: tsukiyohub
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_ENV: prod
      # 容器内互访用服务名
      DATABASE_URL: postgresql+psycopg://tsukiyo:tsukiyo@postgres:5432/tsukiyohub
      VECTOR_BACKEND: milvus
      MILVUS_URI: http://milvus:19530
      # 聊天模型走路由网关（网关再分发到各供应商）
      GATEWAY_ENABLED: "true"
      GATEWAY_ADMIN_URL: http://gateway:8082
      GATEWAY_PUBLIC_URL: http://gateway:8081
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy

  # ---------------------------------------------------------------- 路由网关
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: tsukiyohub-gateway
    restart: unless-stopped
    ports:
      - "8081:8081"   # OpenAI 兼容入口
      - "8082:8082"   # 管理接口 + /metrics
    environment:
      # 密钥从 .env 注入（config.json 里用 ${ENV} 引用）
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-}
      GATEWAY_CLIENT_KEY: ${GATEWAY_CLIENT_KEY:-sk-demo-local}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      DINGTALK_ROBOT_WEBHOOK: ${DINGTALK_ROBOT_WEBHOOK:-}
      DINGTALK_ROBOT_SECRET: ${DINGTALK_ROBOT_SECRET:-}
    volumes:
      - ./gateway/config.json:/app/config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ------------------------------------------------- Prometheus（可选，profile=monitor）
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: tsukiyohub-prometheus
    restart: unless-stopped
    profiles: ["monitor"]
    ports:
      - "9090:9090"
    volumes:
      - ./gateway/deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./gateway/deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: tsukiyohub-alertmanager
    restart: unless-stopped
    profiles: ["monitor"]
    ports:
      - "9093:9093"
    volumes:
      - ./gateway/deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  # ------------------------------------------------- Grafana（可选，profile=monitor）
  # 打开 http://127.0.0.1:3000（默认 admin / admin，首次登录会要求改密码）。
  # 数据源与看板都由 provisioning 自动装配：不需要在 UI 里手动 Add data source / Import。
  # 看板文件：gateway/deploy/grafana/dashboard.json（改完等 30s 自动热更新）。
  grafana:
    image: grafana/grafana:11.2.0
    container_name: tsukiyohub-grafana
    restart: unless-stopped
    profiles: ["monitor"]
    ports:
      - "3000:3000"
    environment:
      # 生产请改这两个值（或在 .env 里覆盖），别用默认密码
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 打开 3000 端口直接落在总览看板，而不是空白 Home
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dashboard.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_DEFAULT_THEME: dark
      # 容器时区跟宿主机（面板时间轴按 UTC 存储，这里只影响 UI 展示）
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 自动装配：数据源 + 看板 provider 配置
      - ./gateway/deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      # 看板本体（dashboards.yml 里 options.path 指向 /var/lib/grafana/dashboards）
      - ./gateway/deploy/grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
      # Grafana 自己的 sqlite（用户、星标、UI 上的临时改动）
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  postgres:
    image: postgres:16-alpine
    container_name: tsukiyohub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tsukiyo
      POSTGRES_PASSWORD: tsukiyo
      POSTGRES_DB: tsukiyohub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsukiyo -d tsukiyohub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Milvus 单机版（官方 compose 精简版：etcd + minio + standalone）----
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: tsukiyohub-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: tsukiyohub-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: tsukiyohub-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5

volumes:
  pgdata:
  etcd_data:
  minio_data:
  milvus_data:
  prometheus_data:
  grafana_data: