# TsukiyoHub 生产部署示例：内核服务 + PostgreSQL + Milvus
#
#   Copy-Item .env.example .env      # 填 LLM_API_KEY / EMBEDDING_API_KEY
#   docker compose up -d
#   打开 http://127.0.0.1:8080/docs
#
# 只想跑演示？把 .env 里 VECTOR_BACKEND 改回 memory、DATABASE_URL 留空，
# 只起 `docker compose up -d app` 即可（SQLite 存在卷里）。

services:
  app:
    build: .
    container_name: tsukiyohub
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_ENV: prod
      # 容器内互访用服务名
      DATABASE_URL: postgresql+psycopg://tsukiyo:tsukiyo@postgres:5432/tsukiyohub
      VECTOR_BACKEND: milvus
      MILVUS_URI: http://milvus:19530
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: tsukiyohub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tsukiyo
      POSTGRES_PASSWORD: tsukiyo
      POSTGRES_DB: tsukiyohub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsukiyo -d tsukiyohub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Milvus 单机版（官方 compose 精简版：etcd + minio + standalone）----
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: tsukiyohub-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: tsukiyohub-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: tsukiyohub-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5

volumes:
  pgdata:
  etcd_data:
  minio_data:
  milvus_data: