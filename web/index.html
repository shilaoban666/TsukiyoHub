<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TsukiyoHub 通用聊天工作台：聊天 / 技能 / 知识库" />
    <title>TsukiyoHub 工作台</title>
    <script>
      // 首帧前套用主题，避免深色模式闪白（与 stores/app.ts 的持久化 key 对齐）
      try {
        var raw = localStorage.getItem('tsukiyohub-app')
        var dark = false
        if (raw) {
          var saved = JSON.parse(raw)
          var mode = saved && saved.themeMode
          dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        } else {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        }
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      } catch (e) {
        /* 隐私模式下 localStorage 不可用，用默认浅色 */
      }
    </script>
    <style>
      /* 首屏骨架：避免 JS 加载期间白屏 */
      #app:empty::after {
        content: '正在加载工作台…';
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #a2a3a5;
        font: 14px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
